buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
        classpath "com.github.recloudstream:gradle:master-SNAPSHOT"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}

subprojects {
    apply plugin: "com.android.library"
    apply plugin: "kotlin-android"
    apply plugin: "com.lagradost.cloudstream3.gradle"

    cloudstream {
        setRepo(System.getenv("GITHUB_REPOSITORY") ?: "local/HHKUNGFU-CloudStream")
    }

    android {
        namespace "com.volong.hhkungfu"
        compileSdkVersion 35

        defaultConfig {
            minSdkVersion 21
            targetSdkVersion 35
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
            freeCompilerArgs += [
                "-Xno-call-assertions",
                "-Xno-param-assertions",
                "-Xno-receiver-assertions"
            ]
        }
    }

    // The old CloudStream template used an "apk" configuration for the
    // CloudStream stub. With this Groovy build, create it explicitly before
    // declaring the dependency.
    configurations.maybeCreate("apk")

    dependencies {
        add("apk", "com.lagradost:cloudstream3:pre-release")
        implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.0"

        implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1"
        implementation "org.jsoup:jsoup:1.13.1"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
        implementation "org.mozilla:rhino:1.7.13"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
