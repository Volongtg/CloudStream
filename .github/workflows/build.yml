name: Build HHKUNGFU CloudStream

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'
      - name: Build plugin
        run: gradle HHKungfu:make --no-daemon
      - name: Collect build output
        run: |
          mkdir -p artifacts
          find HHKungfu/build -type f \( -name '*.cs3' -o -name 'plugins.json' -o -name 'repo.json' \) -exec cp {} artifacts/ \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: HHKUNGFU-CloudStream
          path: artifacts/
