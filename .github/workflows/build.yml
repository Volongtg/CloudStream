name: Build HHKungfu CloudStream

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Clean Gradle state
        run: |
          rm -rf ~/.gradle ~/.kotlin ~/.konan
          mkdir -p "$RUNNER_TEMP/gradle-home"

      - name: Check project
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          chmod +x gradlew
          test -f build.gradle.kts
          test -f settings.gradle.kts
          test -f HHKungfu/build.gradle.kts
          test -f HHKungfu/src/main/kotlin/com/volong/hhkungfu/HHKungfuProvider.kt
          ./gradlew --version

      - name: Build HHKungfu
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          ./gradlew HHKungfu:make \
            --no-daemon \
            --no-build-cache \
            --refresh-dependencies \
            --stacktrace

      - name: Locate CS3
        if: always()
        run: |
          echo "=== CS3 files ==="
          find . -type f -name "*.cs3" -print

      - name: Upload HHKungfu.cs3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HHKungfu
          path: "**/*.cs3"
          if-no-files-found: error
