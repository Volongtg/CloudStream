name: Build HHKungfu CloudStream

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Check project
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Build plugin
        run: |
          chmod +x gradlew || true
          ./gradlew HHKungfu:make --no-daemon --stacktrace

      - name: Find CS3
        run: |
          echo "=== CS3 files ==="
          find . -type f -name "*.cs3" -print

      - name: Upload HHKungfu.cs3
        uses: actions/upload-artifact@v4
        with:
          name: HHKungfu
          path: |
            **/*.cs3
          if-no-files-found: error
