name: Build HHKungfu CloudStream

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Remove all Gradle caches
        run: |
          rm -rf ~/.gradle
          rm -rf ~/.konan
          rm -rf ~/.kotlin
          rm -rf "$RUNNER_TEMP/gradle-user-home"
          mkdir -p "$RUNNER_TEMP/gradle-user-home"

      - name: Install Gradle 7.4.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.4.2-bin.zip
          unzip -q gradle-7.4.2-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-7.4.2/bin" >> "$GITHUB_PATH"

      - name: Verify project
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        run: |
          gradle --version
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f HHKungfu/build.gradle.kts
          test -f HHKungfu/src/main/kotlin/com/volong/hhkungfu/HHKungfuProvider.kt

      - name: Build HHKungfu
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        run: |
          gradle HHKungfu:make \
            --no-daemon \
            --refresh-dependencies \
            --no-build-cache \
            --stacktrace

      - name: Find CS3
        if: always()
        run: |
          echo "=== CS3 files ==="
          find . -type f -name "*.cs3" -print

      - name: Upload HHKungfu.cs3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HHKungfu
          path: "**/*.cs3"
          if-no-files-found: error
