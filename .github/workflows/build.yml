name: Build HHKungfu CloudStream

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Clean Gradle/Kotlin state
        run: |
          rm -rf ~/.gradle ~/.kotlin ~/.konan
          rm -rf "$RUNNER_TEMP/gradle-home"
          mkdir -p "$RUNNER_TEMP/gradle-home"

      - name: Verify Groovy build files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f HHKungfu/build.gradle
          test -f HHKungfu/src/main/kotlin/com/volong/hhkungfu/HHKungfuProvider.kt
          chmod +x gradlew
          ./gradlew --version

      - name: Build HHKungfu
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          ./gradlew HHKungfu:make --no-daemon --refresh-dependencies --no-build-cache --stacktrace

      - name: Locate CS3
        if: always()
        run: find . -type f -name "*.cs3" -print

      - name: Upload HHKungfu.cs3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HHKungfu
          path: "**/*.cs3"
          if-no-files-found: error
