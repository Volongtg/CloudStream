name: Build HHKungfu CloudStream

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Clean Gradle state
        run: |
          rm -rf ~/.gradle ~/.kotlin ~/.konan
          rm -rf "$RUNNER_TEMP/gradle-home"
          mkdir -p "$RUNNER_TEMP/gradle-home"

      - name: Verify project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f HHKungfu/build.gradle
          test -f HHKungfu/src/main/kotlin/com/volong/hhkungfu/HHKungfuProvider.kt
          chmod +x gradlew
          echo "=== Toolchain configuration ==="
          java -version
          grep -n "com.android.tools.build:gradle" build.gradle.kts
          grep -n "kotlin-gradle-plugin" build.gradle.kts
          echo "=== Gradle wrapper configuration ==="
          grep -n "distributionUrl" gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Build HHKungfu
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          ./gradlew HHKungfu:make \
            --no-daemon \
            --refresh-dependencies \
            --no-build-cache \
            --stacktrace

      - name: Locate CS3
        if: always()
        run: |
          echo "=== CS3 files ==="
          find . -type f -name "*.cs3" -print

      - name: Upload HHKungfu.cs3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HHKungfu
          path: "**/*.cs3"
          if-no-files-found: error
