name: Build HHKungfu CloudStream

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Verify project and Gradle launcher
        run: |
          chmod +x gradlew
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f HHKungfu/build.gradle.kts
          test -f HHKungfu/src/main/kotlin/com/volong/hhkungfu/HHKungfuProvider.kt

      - name: Build HHKungfu
        run: |
          ./gradlew HHKungfu:make --no-daemon --refresh-dependencies --no-build-cache --stacktrace

      - name: Find CS3
        if: always()
        run: find . -type f -name "*.cs3" -print

      - name: Upload HHKungfu.cs3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HHKungfu
          path: "**/*.cs3"
          if-no-files-found: error
