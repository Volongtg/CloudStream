name: Build HHKungfu CloudStream

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'
          cache-disabled: true

      - name: Verify project
        run: |
          echo "=== Project ==="
          pwd
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f HHKungfu/build.gradle.kts
          test -f HHKungfu/src/main/kotlin/com/volong/hhkungfu/HHKungfuProvider.kt
          echo "Project structure OK"

      - name: Build HHKungfu
        run: |
          gradle HHKungfu:make --no-daemon --refresh-dependencies --stacktrace

      - name: Show CS3 output
        if: always()
        run: |
          echo "=== CS3 files ==="
          find . -type f -name "*.cs3" -print

      - name: Upload HHKungfu.cs3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HHKungfu
          path: "**/*.cs3"
          if-no-files-found: error
