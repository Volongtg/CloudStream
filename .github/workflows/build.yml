name: Build HHKungfu CloudStream

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  diagnose-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Show exact Gradle files
        run: |
          echo "=== settings.gradle.kts ==="
          sed -n '1,220p' settings.gradle.kts
          echo "=== root build.gradle.kts ==="
          sed -n '1,320p' build.gradle.kts
          echo "=== HHKungfu/build.gradle.kts ==="
          sed -n '1,220p' HHKungfu/build.gradle.kts
          echo "=== Gradle properties ==="
          sed -n '1,220p' gradle.properties || true

      - name: Clean all runner Gradle/Kotlin state
        run: |
          rm -rf ~/.gradle ~/.kotlin ~/.konan
          rm -rf "$RUNNER_TEMP/gradle"
          mkdir -p "$RUNNER_TEMP/gradle"

      - name: Check launcher
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build with detailed diagnostics
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
        run: |
          ./gradlew HHKungfu:make             --no-daemon             --no-build-cache             --refresh-dependencies             --stacktrace             --info

      - name: Locate CS3
        if: always()
        run: find . -type f -name "*.cs3" -print
